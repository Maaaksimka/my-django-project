{% extends 'newsapp/base.html' %}

{% block title %}
  Articles
{% endblock %}

{% block body %}
  <h1>Articles</h1>
  {% if object_list %}
    <div>
    {% for article in object_list %}
      <div>
        <p>
          <a href="{% url 'newsapp:article' pk=article.pk %}">{{ article.title }}</a>
        </p>
        <P>Published: {{ article.published_at }}</P>
      </div>
    {% endfor %}
    </div>
  {% else %}
    <h3>No published articles yet</h3>
  {% endif %}
{% endblock %}
